AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - agenda parser Lambda (outside VPC) calling Amazon Bedrock directly.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  ImageUri:
    Type: String
    Description: Backend container image URI (reused for agenda-parser).

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [arm64, x86_64]
    Description: CPU architecture matching the backend container image.

  ParserModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID for agenda parsing.

  CorsOrigins:
    Type: String
    Description: Comma-separated allowed origins for the Function URL CORS.

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for token verification.

  CognitoClientId:
    Type: String
    Description: Cognito User Pool App Client ID for token verification.

  CognitoJwks:
    Type: String
    Default: ""
    Description: Optional pre-fetched JWKS JSON.

Resources:
  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-agenda-parser-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-mantle:CreateInference
                  - bedrock:GetInferenceProfile
                  - bedrock:ListInferenceProfiles
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Role: !GetAtt AgendaParserRole.Arn
      Timeout: 30
      MemorySize: 512
      Architectures:
        - !Ref Architecture
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AgendaParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Split [",", !Ref CorsOrigins]
        AllowMethods: ["POST"]
        AllowHeaders: ["authorization", "content-type"]

  AgendaParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ParserUrl:
    Description: Agenda parser function URL.
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl

  ParserFunctionArn:
    Description: Agenda parser Lambda function ARN.
    Value: !GetAtt AgendaParserFunction.Arn
